  <rect x="430" y="114" width="298" height="92" rx="14" fill="#2c1c0f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="140" fill="#fcd34d" font-family="sans-serif" font-size="11" font-weight="bold">NEW INSTANT ORDER • TABLE 04</text>
