  <rect x="430" y="320" width="298" height="106" rx="14" fill="#26180d" stroke="#472e17" stroke-width="1"/>
  <text x="450" y="346" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Today’s Revenue Snapshot</text>
  <text x="450" y="378" fill="#fbbf24" font-family="sans-serif" font-size="24" font-weight="900">₦485,200</text>
  <rect x="450" y="394" width="258" height="14" rx="7" fill="#36220c"/>
  <rect x="450" y="394" width="204" height="14" rx="7" fill="url(#instaGold)"/>
