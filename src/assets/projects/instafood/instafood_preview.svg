  <text x="46" y="150" fill="#e5c79e" font-family="sans-serif" font-size="14">Customer Ordering • Cashier Dashboard • Kitchen Feed</text>

  <!-- Customer Checkout -> Socket -> Kitchen -->
  <rect x="46" y="184" width="320" height="72" rx="14" fill="#23160b" stroke="#472e17" stroke-width="1"/>
