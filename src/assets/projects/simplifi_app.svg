<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20"/>
      <stop offset="50%" stop-color="#1a153a"/>
      <stop offset="100%" stop-color="#0d091a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915eff"/>
      <stop offset="100%" stop-color="#00cea8"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#915eff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#915eff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <!-- Decorative Glow -->
  <circle cx="400" cy="200" r="180" fill="#915eff" opacity="0.15" filter="blur(40px)"/>
  <circle cx="600" cy="350" r="120" fill="#00cea8" opacity="0.1" filter="blur(30px)"/>
  
  <!-- Phone Frame Mockup -->
  <rect x="250" y="40" width="300" height="420" rx="30" fill="#151030" stroke="#3c3350" stroke-width="4"/>
  <rect x="340" y="52" width="120" height="18" rx="9" fill="#050816"/>
  
  <!-- App Header -->
  <text x="280" y="100" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Simplifi Finance</text>
  <circle cx="510" cy="95" r="14" fill="#232631"/>
  <text x="510" y="99" fill="#915eff" font-family="sans-serif" font-size="12" text-anchor="middle">★</text>
  
  <!-- Main Balance Card -->
  <rect x="275" y="120" width="250" height="110" rx="16" fill="url(#cardGrad)"/>
  <text x="295" y="145" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="12">Total Balance</text>
  <text x="295" y="175" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">₦ 2,485,000</text>
  <text x="295" y="205" fill="#ffffff" opacity="0.9" font-family="sans-serif" font-size="11">•••• •••• •••• 4589</text>
  
  <!-- Chart Area -->
  <rect x="275" y="245" width="250" height="100" rx="12" fill="#1d1836"/>
  <path d="M 290 310 Q 320 280 350 295 T 410 270 T 470 285 T 510 260 L 510 330 L 290 330 Z" fill="url(#chartGrad)"/>
  <path d="M 290 310 Q 320 280 350 295 T 410 270 T 470 285 T 510 260" fill="none" stroke="#915eff" stroke-width="3"/>
  
  <!-- Action Buttons -->
  <rect x="275" y="360" width="115" height="40" rx="10" fill="#915eff"/>
  <text x="332" y="385" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Send Money</text>
  
  <rect x="410" y="360" width="115" height="40" rx="10" fill="#232631" stroke="#915eff" stroke-width="1"/>
  <text x="467" y="385" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Analytics</text>
  
  <!-- Bottom Indicator -->
  <rect x="360" y="445" width="80" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
</svg>
