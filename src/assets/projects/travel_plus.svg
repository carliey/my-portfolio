<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#121b2d"/>
      <stop offset="100%" stop-color="#070c16"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#00cea8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad2)"/>
  <circle cx="500" cy="200" r="160" fill="#2f80ed" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Phone Frame Mockup -->
  <rect x="250" y="40" width="300" height="420" rx="30" fill="#101726" stroke="#253550" stroke-width="4"/>
  <rect x="340" y="52" width="120" height="18" rx="9" fill="#050816"/>
  
  <!-- Map Mock Grid -->
  <path d="M 270 120 L 530 120 M 270 180 L 530 180 M 270 240 L 530 240 M 270 300 L 530 300" stroke="#1c2a40" stroke-width="2"/>
  <path d="M 320 90 L 320 320 M 390 90 L 390 320 M 460 90 L 460 320" stroke="#1c2a40" stroke-width="2"/>
  
  <!-- Route Line -->
  <path d="M 320 280 Q 320 180 460 140" fill="none" stroke="url(#routeGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Driver & User Pin -->
  <circle cx="320" cy="280" r="10" fill="#00cea8"/>
  <circle cx="320" cy="280" r="16" fill="none" stroke="#00cea8" stroke-width="2" opacity="0.6"/>
  
  <circle cx="460" cy="140" r="10" fill="#2f80ed"/>
  <text x="460" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Destination</text>
  
  <!-- Booking Card Overlay -->
  <rect x="270" y="320" width="260" height="110" rx="16" fill="#152238" stroke="#2a3d5e" stroke-width="1"/>
  <text x="290" y="348" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Travel Plus Logistics</text>
  <text x="290" y="370" fill="#2f80ed" font-family="sans-serif" font-size="12">Driver Arriving in 4 mins</text>
  
  <rect x="290" y="385" width="220" height="32" rx="8" fill="#2f80ed"/>
  <text x="400" y="406" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Track Real-time Trip</text>
</svg>
